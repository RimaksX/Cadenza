[package]
name = "cadenza-ui"
description = "Cadenza Slint UI: views, view models, commands, theme."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Layering rule (PROJECT_MASTER 4.2): ui -> infra is forbidden. The absence of
# cadenza-infra here is what enforces it — a violation fails to compile.
[dependencies]
cadenza-core.workspace = true

# The interface (PROJECT_MASTER 3.2). Pinned to 1.13 rather than the newest
# release: 1.17 requires rustc 1.92 and would raise the workspace's minimum
# toolchain for no feature this milestone needs.
slint = "1.13"

# The same backend Slint would have chosen, asked for by name so that a handler
# can be hung on its event loop. Files dragged from the desktop arrive as winit
# events that Slint itself does not look at (MASTER_ISSUES 57); this is the
# published seam for reaching them, and it costs no `unsafe` and no Win32.
i-slint-backend-winit = "1.13"

[build-dependencies]
slint-build = "1.13"
