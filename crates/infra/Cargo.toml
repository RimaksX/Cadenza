[package]
name = "cadenza-infra"
description = "Cadenza infrastructure: SQLite, audio engine, metadata, file watching, analysis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cadenza-core.workspace = true

# `bundled` compiles SQLite into the binary. Cadenza ships as a single executable
# with no runtime to install, so linking against whatever SQLite the machine
# happens to have is not an option.
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Resolves %APPDATA% and %LOCALAPPDATA% through the shell API rather than
# environment variables, which are not guaranteed to be set.
directories = "6"

# Settings are stored as JSON scalars. Only the adapter sees the encoding; the
# domain deals in SettingValue. Hand-rolling string escaping was the alternative.
serde_json = "1"

# Tag and stream-property reading.
lofty = "0.24"

# Content hashing for duplicate detection. blake3 rather than a SHA family
# function because a 5000-track library is tens of gigabytes to read, and the
# background budget is about 20% of one CPU.
blake3 = "1.8"

# Filesystem watching.
notify = "8"

# Audio output. On Windows this is WASAPI in shared mode.
cpal = "0.18"

# Decoding. Only the five required formats are enabled:
# every additional codec is code compiled into the binary that the scanner would
# never hand it, because the list is fixed. `isomp4` is the container AAC and
# ALAC arrive in; `flac`, `wav` and `pcm` are already on by default.
symphonia = { version = "0.6", features = ["mp3", "aac", "alac", "isomp4"] }

# Sample-rate conversion. The output device runs at one fixed rate — usually
# 48 kHz on Windows — while most files are 44.1 kHz, and
# playing one at the other's rate shifts the pitch.
rubato = "4"

# Spectrum analysis for the visualiser. A thousand points thirty times a second
# is arithmetic either of us could write; what a
# library buys is the planner that picks an algorithm for the length, and the
# certainty that the transform itself is not where a bug is.
rustfft = "6"

# The system's own folder chooser. Not a convenience: reaching `IFileDialog`
# directly means COM and `unsafe`, and every crate here forbids it — this is a
# thin safe wrapper over exactly that call. Default features off because they
# are the Linux portal and an async runtime, and Windows is the whole target.
rfd = { version = "0.15", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }

# A dev-dependency cycle: testkit depends on infra for the migration runner, and
# infra's integration tests depend on testkit for a migrated database. Cargo
# supports this, and the alternative — a second schema builder inside the tests —
# would test something production never runs.
[dev-dependencies]
cadenza-testkit.workspace = true
