[package]
name = "cadenza-infra"
description = "Cadenza infrastructure: SQLite, audio engine, metadata, file watching, analysis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cadenza-core.workspace = true

# `bundled` compiles SQLite into the binary. Cadenza ships as a single executable
# with no runtime to install (PROJECT_MASTER 1.2), so linking against whatever
# SQLite the machine happens to have is not an option.
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Resolves %APPDATA% and %LOCALAPPDATA% through the shell API rather than
# environment variables, which are not guaranteed to be set (PROJECT_MASTER 6).
directories = "6"

# Settings are stored as JSON scalars. Only the adapter sees the encoding; the
# domain deals in SettingValue. Hand-rolling string escaping was the alternative.
serde_json = "1"

# Tag and stream-property reading (PROJECT_MASTER 3.5).
lofty = "0.24"

# Content hashing for duplicate detection. blake3 rather than a SHA family
# function because a 5000-track library is tens of gigabytes to read, and the
# background budget is about 20% of one CPU (PROJECT_MASTER 2.11).
blake3 = "1.8"

# Filesystem watching (PROJECT_MASTER 3.6).
notify = "8"

# cpal/symphonia/rubato/rustfft are added in M5 and later.

# A dev-dependency cycle: testkit depends on infra for the migration runner, and
# infra's integration tests depend on testkit for a migrated database. Cargo
# supports this, and the alternative — a second schema builder inside the tests —
# would test something production never runs.
[dev-dependencies]
cadenza-testkit.workspace = true
