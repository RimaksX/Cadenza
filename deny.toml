# What the dependency tree is allowed to contain.
#
# Deferred from the start, when there were three dependencies and nothing to
# check; there are 682 of them now. Run it with:
#
#     cargo deny check
#
# The list below was taken from the tree rather than guessed at: every licence
# named here is one that some crate in this workspace actually declares. Adding
# a dependency that introduces a new one is meant to fail, so that the decision
# is made on purpose.

# The one platform this program is built for.
#
# A lockfile holds every crate every target could need, and checking all of
# them means answering for code this application never compiles. The first run
# stopped on a vulnerability in `quick-xml`, four levels under
# `accesskit_unix` — the Linux accessibility backend, which a Windows-only
# player has no path to at all. Filtering the graph to the target is not
# looking away: it is checking what actually ships, and it makes an advisory
# that appears here something to act on rather than something to explain away.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
# A known vulnerability fails the check, wherever in the tree it is. Nothing is
# ignored here, and anything added should carry the date and the reason beside
# it.
ignore = []

# Being unmaintained is only checked for crates this workspace chose itself.
#
# The first run of this check failed on `ttf-parser`, which arrived through
# Slint's text stack and is four levels down. That is a true fact and not an
# actionable one: the only ways to answer it are to stop using Slint or to
# ignore it, and a check that reports something nobody can act on is a check
# people learn to skip — which is how the vulnerability that *does* matter goes
# past unread. An unmaintained crate this project picked is its own problem and
# still fails.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    # Cadenza itself and the UI toolkit it is built on. Slint offers other
    # terms as alternatives — `LicenseRef-Slint-*` below — and this project
    # takes the GPL branch, which is why the whole work is GPL-3.0-only.
    "GPL-3.0-only",
    "LGPL-2.1-or-later",

    # Weak copyleft, per file rather than per work.
    "MPL-2.0",

    # Permissive.
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "NCSA",
    "Unicode-3.0",
]

# Slint's own alternative terms, which sit beside the GPL in an OR expression.
# Named so that the check can see the whole expression is satisfiable; the
# branch this project relies on is the GPL one above.
[[licenses.clarify]]
crate = "slint"
expression = "GPL-3.0-only"
license-files = []

[bans]
# A warning rather than a failure: two versions of one crate is untidy and
# sometimes unavoidable while a dependency catches up. `cargo tree -d` is empty
# today, and this is what says so if that changes.
multiple-versions = "warn"
# A version requirement of "*" is a dependency on whatever exists tomorrow.
wildcards = "deny"
# Except between the crates of this workspace, which refer to each other by
# path and carry no version because none of them is published. Those are not a
# dependency on whatever exists tomorrow; they are four parts of one program
# that are always built together from the same commit.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
