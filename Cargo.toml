[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/core",
    "crates/infra",
    "crates/ui",
    "crates/testkit",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
# Back, now that there is somewhere for it to point. It was removed when it held
# an invented address, on the terms that it would return the day the repository
# existed (MASTER_ISSUES 72).
repository = "https://github.com/RimaksX/Cadenza"

[workspace.dependencies]
cadenza-core = { path = "crates/core" }
cadenza-infra = { path = "crates/infra" }
cadenza-ui = { path = "crates/ui" }
cadenza-testkit = { path = "crates/testkit" }

[profile.release]
lto = "thin"
codegen-units = 1
# What goes into an installer should be the program and not the map of it.
# Nothing reads a symbol name in a shipped build: a panic reports the message
# and the location the line tables carry, and both of those come from the
# `debug` setting rather than from this one.
strip = "symbols"

# Debug information is what makes `target/debug` enormous on Windows, where it
# lands in a `.pdb` beside every artefact. Measured here: 40 GB of build output,
# of which the UI crate alone accounted for four hundred megabytes per copy —
# and cargo keeps every copy it has ever built.
#
# Ours keeps line tables, so a panic still names a file and a line, which is the
# only thing a backtrace here is ever asked for. Dependencies keep nothing: a
# breakpoint inside Slint is not something this project debugs, and their debug
# info is the bulk of the weight.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
